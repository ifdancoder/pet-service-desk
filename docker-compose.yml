services:
  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow-dev-secret
      POSTGRES_DB: supportflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing-db.sh:/docker-entrypoint-initdb.d/init-testing-db.sh
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: supportflow
      MINIO_ROOT_PASSWORD: supportflow-dev-secret
    volumes: ["minio-data:/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
volumes:
  postgres-data:
  minio-data:
  elasticsearch-data:
